<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="Authentication success page that redirects to the test area." />
    <meta name="keywords" content="authentication, success, redirect, test" />
    <title>Auth Success</title>
    <meta http-equiv="refresh" content="0; url=/test/?auth=github-success" />
  </head>
  <body>
    <p>Redirecting…</p>
    <script>
        try {
          sessionStorage.setItem('frogger.github.success', '1');
        } catch {
          // Ignore storage errors and continue redirect
        }
        window.location.replace('/test/?auth=github-success');
    </script>
  </body>
</html>
